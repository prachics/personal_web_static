<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Chartalist: UTXO and account-based blockchains feed an open catalogue that serves machine-learning-ready graph datasets">
  <rect width="1200" height="675" fill="#FAFAF8"/>
  <g transform="translate(0,44)">
  <text x="80" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#111827">ML-Ready Graph Datasets</text>
  <text x="80" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="19" fill="#6B7280">Open-science catalogue for blockchain machine learning</text>

  <!-- chains -->
  <rect x="80" y="212" width="250" height="86" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="106" y="248" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#111827">Bitcoin</text>
  <text x="106" y="274" font-family="system-ui, sans-serif" font-size="15" fill="#6B7280">UTXO model</text>

  <rect x="80" y="330" width="250" height="86" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="106" y="366" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#111827">Ethereum</text>
  <text x="106" y="392" font-family="system-ui, sans-serif" font-size="15" fill="#6B7280">account-based</text>

  <g stroke="#1D4ED8" stroke-width="2" fill="none" opacity="0.55">
    <path d="M330 255 C 390 255, 390 314, 450 314"/>
    <path d="M330 373 C 390 373, 390 314, 450 314"/>
  </g>
  <path d="M444 308 L 458 314 L 444 320 Z" fill="#1D4ED8"/>

  <!-- catalogue -->
  <rect x="460" y="240" width="270" height="148" rx="10" fill="#111827"/>
  <text x="595" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#FFFFFF">Chartalist</text>
  <text x="595" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#9CA3AF">labelled graph datasets</text>
  <text x="595" y="344" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#9CA3AF">search, filter, download</text>
  <text x="595" y="370" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#1D4ED8">chartalist.org</text>

  <path d="M750 314 L 820 314" stroke="#1D4ED8" stroke-width="2"/>
  <path d="M814 308 L 828 314 L 814 320 Z" fill="#1D4ED8"/>

  <!-- outputs -->
  <g>
    <rect x="840" y="212" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="866" y="250" font-family="system-ui, sans-serif" font-size="18" fill="#111827">Python dataloaders</text>

    <rect x="840" y="284" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="866" y="322" font-family="system-ui, sans-serif" font-size="18" fill="#111827">NetworkX digraphs</text>

    <rect x="840" y="356" width="280" height="62" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2"/>
    <text x="866" y="394" font-family="system-ui, sans-serif" font-size="18" fill="#111827">ransomware, fraud labels</text>
  </g>
  </g>
</svg>
